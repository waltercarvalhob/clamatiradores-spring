spring:
  application:
    name: clamatiradores-spring

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bdsocio}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:252107}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      pool-name: ClamAtiradoresHikariPool

  jpa:
    open-in-view: false
    hibernate:
      # Nunca altera o schema existente do bdsocio: apenas valida se as entidades
      # batem com as colunas reais no startup. Ajuste as entidades se a validacao falhar.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false
    encoding: UTF-8

  security:
    user:
      # Desliga o usuario padrao gerado pelo Spring Boot: a autenticacao real
      # vem de UsuarioDetailsService/tabela usuario.
      name: disabled-default-user
      password: disabled-default-user

server:
  # Render (e a maioria dos PaaS) injeta a variavel PORT em runtime; SERVER_PORT
  # continua funcionando para quem preferir definir explicitamente.
  port: ${PORT:${SERVER_PORT:8080}}

app:
  admin:
    username: ${ADMIN_SEED_USERNAME:admin}
    password: ${ADMIN_SEED_PASSWORD:changeme}
  security:
    # Assina o cookie do "Lembrar-me" (14 dias, padrao do Spring Security). Nao precisa
    # ser segredo tao critico quanto a senha (so afeta esse cookie), mas troque em producao.
    remember-me-key: ${REMEMBER_ME_KEY:changeme-remember-me-key}

logging:
  level:
    com.clamatiradores: DEBUG
