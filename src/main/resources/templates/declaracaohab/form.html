<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/base}"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
	<title th:text="${declaracaohabForm.idDec} != null ? 'Editar Declaracao de Habitualidade' : 'Nova Declaracao de Habitualidade'">Declaracao de Habitualidade</title>
</head>
<body>
<div layout:fragment="content">

	<h1 class="h3 mb-4" th:text="${declaracaohabForm.idDec} != null ? 'Editar Declaracao de Habitualidade' : 'Nova Declaracao de Habitualidade'">Declaracao de Habitualidade</h1>

	<div class="card mb-3">
		<div class="card-body py-2">
			<span class="text-muted small">Socio:</span>
			<strong th:text="${declaracaohabForm.socioNome}"></strong>
			<span class="text-muted small ms-2" th:text="'CPF ' + ${declaracaohabForm.socioCpf}"></span>
		</div>
	</div>

	<div class="card card-form p-4 p-md-5">
	<form method="post" th:object="${declaracaohabForm}"
		  th:action="${declaracaohabForm.idDec} != null ? @{/declaracoes-hab/{id}(id=${declaracaohabForm.idDec})} : @{/declaracoes-hab}">
		<input type="hidden" th:field="*{idSocio}">

		<div class="row g-3 mb-4">
			<div class="col-md-3">
				<label class="form-label">Dia</label>
				<input type="text" class="form-control" th:field="*{dia}">
			</div>
			<div class="col-md-3">
				<label class="form-label">Mes</label>
				<input type="text" class="form-control" th:field="*{mes}">
			</div>
			<div class="col-md-3">
				<label class="form-label">Ano</label>
				<input type="text" class="form-control" th:field="*{ano}">
			</div>
			<div class="col-md-3">
				<label class="form-label">Data de Filiacao</label>
				<input type="date" class="form-control" th:field="*{datainsc}">
			</div>
			<div class="col-md-4">
				<label class="form-label">Data de Emissao</label>
				<input type="date" class="form-control" th:field="*{dataemissao}">
			</div>
			<div class="col-md-4">
				<label class="form-label">Data de Validade</label>
				<input type="date" class="form-control" th:field="*{datavalidade}">
			</div>
		</div>

		<h2 class="h5 mb-3">Eventos de Habitualidade</h2>
		<p class="text-muted small">Ate 20 registros de local, data e tipo (treino ou competicao).</p>

		<div class="table-responsive mb-4">
			<table class="table table-sm table-bordered align-middle">
				<thead class="table-light">
					<tr>
						<th style="width:3rem">#</th>
						<th>Local</th>
						<th style="width:12rem">Data do Evento</th>
						<th style="width:12rem">Treino / Competicao</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="row, stat : *{eventos}">
						<td class="text-muted" th:text="${stat.count}"></td>
						<td>
							<input type="text" class="form-control form-control-sm"
								   th:field="*{eventos[__${stat.index}__].local}">
						</td>
						<td>
							<input type="date" class="form-control form-control-sm"
								   th:field="*{eventos[__${stat.index}__].dataevento}">
						</td>
						<td>
							<select class="form-select form-select-sm" th:field="*{eventos[__${stat.index}__].treinoCompeticao}">
								<option value="">-</option>
								<option value="TREINO">Treino</option>
								<option value="COMPETICAO">Competicao</option>
							</select>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div class="d-flex gap-2">
			<button type="submit" class="btn btn-primary">Salvar</button>
			<a class="btn btn-outline-secondary" th:href="@{/declaracoes-hab}">Cancelar</a>
		</div>
	</form>
	</div>

</div>
</body>
</html>
