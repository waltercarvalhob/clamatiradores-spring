<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login - Clam Atiradores</title>
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
	<div class="auth-shell">
		<div class="auth-card">
			<h1 class="h4">Clam Atiradores</h1>
			<p class="auth-subtitle">Acesse com seu usuario e senha</p>

			<div class="alert alert-danger auth-alert" th:if="${param.error}">Usuario ou senha invalidos.</div>
			<div class="alert alert-success auth-alert" th:if="${param.logout}">Sessao encerrada.</div>

			<form method="post" th:action="@{/login}">
				<div class="auth-field">
					<span class="auth-icon">
						<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
							<circle cx="8" cy="5" r="3"/>
							<path d="M2.5 14c.5-3.5 3-5 5.5-5s5 1.5 5.5 5"/>
						</svg>
					</span>
					<input type="text" name="username" placeholder="Usuario" required autofocus autocomplete="username">
				</div>
				<div class="auth-field">
					<span class="auth-icon">
						<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
							<rect x="3" y="7" width="10" height="7" rx="1.5"/>
							<path d="M5.5 7V4.5a2.5 2.5 0 0 1 5 0V7"/>
						</svg>
					</span>
					<input type="password" name="password" placeholder="Senha" required autocomplete="current-password">
				</div>

				<label class="auth-check">
					<input type="checkbox" name="remember-me" class="form-check-input m-0">
					Lembrar-me
				</label>

				<button type="submit" class="btn-auth">ENTRAR</button>
			</form>
		</div>
	</div>
</body>
</html>
