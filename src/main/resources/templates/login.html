<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login - Clam Atiradores</title>
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
	<div class="container" style="max-width: 400px; margin-top: 12vh;">
		<div class="card shadow-sm">
			<div class="card-body p-4">
				<h1 class="h4 mb-4 text-center">Clam Atiradores</h1>

				<div class="alert alert-danger" th:if="${param.error}">Usuario ou senha invalidos.</div>
				<div class="alert alert-success" th:if="${param.logout}">Sessao encerrada.</div>

				<form method="post" th:action="@{/login}">
					<div class="mb-3">
						<label class="form-label">Usuario</label>
						<input type="text" class="form-control" name="username" required autofocus>
					</div>
					<div class="mb-3">
						<label class="form-label">Senha</label>
						<input type="password" class="form-control" name="password" required>
					</div>
					<button type="submit" class="btn btn-primary w-100">Entrar</button>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
