<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login - Clam Atiradores</title>
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-body">
	<div class="auth-shell">
		<h1 class="auth-title">Clube de Atiradores<br>do Maranhão</h1>

		<div class="auth-card">
			<h2 class="auth-card-title">Login</h2>

			<div class="alert alert-danger auth-alert" th:if="${param.error}">Usuario ou senha invalidos.</div>
			<div class="alert alert-success auth-alert" th:if="${param.logout}">Sessao encerrada.</div>

			<form method="post" th:action="@{/login}">
				<div class="auth-field">
					<label for="username">Usuario</label>
					<input id="username" type="text" name="username" required autofocus autocomplete="username">
				</div>
				<div class="auth-field">
					<label for="password">Senha</label>
					<input id="password" type="password" name="password" required autocomplete="current-password">
				</div>

				<label class="auth-check">
					<input type="checkbox" name="remember-me" class="form-check-input m-0">
					Lembrar-me
				</label>

				<button type="submit" class="btn-auth">ENTRAR</button>
			</form>
		</div>

		<img class="auth-logo" th:src="@{/img/logoclamatiradores.jpg}" alt="CLAM">
	</div>
</body>
</html>
