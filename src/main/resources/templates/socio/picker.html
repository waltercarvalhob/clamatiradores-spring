<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/base}"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
	<title th:text="${targetLabel} ?: 'Selecionar Socio'">Selecionar Socio</title>
</head>
<body>
<div layout:fragment="content">

	<h1 class="h3 mb-1" th:text="'Selecionar Socio' + (${targetLabel} != null ? ' - ' + ${targetLabel} : '')">Selecionar Socio</h1>
	<p class="text-muted mb-4">Escolha o socio para o qual deseja criar o registro.</p>

	<form class="row g-2 mb-4 align-items-end" method="get" th:action="@{/socio-picker}">
		<input type="hidden" name="target" th:value="${target}">
		<input type="hidden" name="targetLabel" th:value="${targetLabel}">
		<div class="col-sm-6 col-md-4">
			<label class="form-label small mb-1">Nome</label>
			<input type="text" class="form-control" name="nome" th:value="${criteria.nome}">
		</div>
		<div class="col-sm-6 col-md-3">
			<label class="form-label small mb-1">CPF</label>
			<input type="text" class="form-control" name="cpf" th:value="${criteria.cpf}">
		</div>
		<div class="col-sm-6 col-md-2">
			<label class="form-label small mb-1">CR</label>
			<input type="text" class="form-control" name="numcr" th:value="${criteria.numcr}">
		</div>
		<div class="col-md-3 d-flex gap-2">
			<button type="submit" class="btn btn-outline-primary w-100">Pesquisar</button>
		</div>
	</form>

	<div class="table-responsive">
		<table class="table table-striped table-hover align-middle">
			<thead>
				<tr>
					<th>Nome</th>
					<th>CPF</th>
					<th>CR</th>
					<th class="text-end">Acao</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="socio : ${page.content}">
					<td th:text="${socio.nome}"></td>
					<td th:text="${socio.cpf}"></td>
					<td th:text="${socio.numcr}"></td>
					<td class="text-end">
						<a class="btn btn-sm btn-primary" th:href="@{__${target}__(idSocio=${socio.idSocio})}">Selecionar</a>
					</td>
				</tr>
				<tr th:if="${page.empty}">
					<td colspan="4" class="text-center text-muted py-4">Nenhum socio encontrado.</td>
				</tr>
			</tbody>
		</table>
	</div>

	<nav th:if="${page.totalPages > 1}" aria-label="Paginacao">
		<ul class="pagination flex-wrap">
			<li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
				th:classappend="${i == page.number} ? 'active'">
				<a class="page-link"
				   th:href="@{/socio-picker(page=${i}, size=${page.size}, target=${target}, targetLabel=${targetLabel}, nome=${criteria.nome}, cpf=${criteria.cpf}, numcr=${criteria.numcr})}"
				   th:text="${i + 1}"></a>
			</li>
		</ul>
	</nav>

</div>
</body>
</html>
