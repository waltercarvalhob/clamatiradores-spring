<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/base}"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
	<title>Usuarios</title>
</head>
<body>
<div layout:fragment="content">

	<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
		<h1 class="h3 mb-0">Usuarios</h1>
		<a class="btn btn-primary" th:href="@{/usuarios/novo}">+ Novo Usuario</a>
	</div>

	<div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

	<div class="card search-panel p-3 p-md-4 mb-4">
	<form class="row g-2 align-items-end live-search-form" method="get" th:action="@{/usuarios}">
		<div class="col-sm-6 col-md-4">
			<label class="form-label small mb-1">Usuario</label>
			<input type="text" class="form-control" name="username" th:value="${username}">
		</div>
		<div class="col-md-2 d-flex gap-2">
			<button type="submit" class="btn btn-outline-primary w-100">Pesquisar</button>
		</div>
	</form>
	</div>

	<div id="resultados" th:fragment="resultados">

	<div class="table-responsive">
		<table class="table table-striped table-hover align-middle">
			<thead>
				<tr>
					<th>Usuario</th>
					<th>Perfil</th>
					<th>Status</th>
					<th class="text-end">Acoes</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item : ${page.content}">
					<td th:text="${item.username}"></td>
					<td th:text="${item.role == 'ADMIN'} ? 'Administrador' : 'Usuario'"></td>
					<td>
						<span class="badge" th:classappend="${item.enabled} ? 'text-bg-success' : 'text-bg-secondary'"
							  th:text="${item.enabled} ? 'Ativo' : 'Inativo'"></span>
					</td>
					<td class="text-end text-nowrap">
						<a class="btn btn-sm btn-outline-secondary" th:href="@{/usuarios/{id}/editar(id=${item.idUsuario})}">Editar</a>
						<button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal"
								th:attr="data-bs-target=${'#excluirModal' + item.idUsuario}">Excluir</button>

						<div class="modal fade" tabindex="-1" th:id="${'excluirModal' + item.idUsuario}">
							<div class="modal-dialog">
								<div class="modal-content text-start">
									<div class="modal-header">
										<h5 class="modal-title">Confirmar exclusao</h5>
										<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
									</div>
									<div class="modal-body">
										Confirma a exclusao do usuario <strong th:text="${item.username}"></strong>?
										Esta acao nao pode ser desfeita.
									</div>
									<div class="modal-footer">
										<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
										<form method="post" th:action="@{/usuarios/{id}/excluir(id=${item.idUsuario})}">
											<button type="submit" class="btn btn-danger">Excluir</button>
										</form>
									</div>
								</div>
							</div>
						</div>
					</td>
				</tr>
				<tr th:if="${page.empty}">
					<td colspan="4" class="text-center text-muted py-4">Nenhum usuario encontrado.</td>
				</tr>
			</tbody>
		</table>
	</div>

	<nav th:if="${page.totalPages > 1}" aria-label="Paginacao">
		<ul class="pagination flex-wrap" th:with="pages=${T(com.clamatiradores.common.web.Pagination).window(page.number, page.totalPages)}">
			<li class="page-item" th:classappend="${page.first} ? 'disabled'">
				<a class="page-link" th:href="@{/usuarios(page=${page.number - 1}, size=${page.size}, username=${username})}">&laquo;</a>
			</li>
			<li class="page-item" th:each="p : ${pages}"
				th:classappend="${p == page.number} ? 'active' : (${p == -1} ? 'disabled')">
				<span th:if="${p == -1}" class="page-link">&hellip;</span>
				<a th:unless="${p == -1}" class="page-link" th:href="@{/usuarios(page=${p}, size=${page.size}, username=${username})}" th:text="${p + 1}"></a>
			</li>
			<li class="page-item" th:classappend="${page.last} ? 'disabled'">
				<a class="page-link" th:href="@{/usuarios(page=${page.number + 1}, size=${page.size}, username=${username})}">&raquo;</a>
			</li>
		</ul>
	</nav>

	</div>

</div>
</body>
</html>
