<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/base}"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
	<title th:text="${usuarioForm.idUsuario} != null ? 'Editar Usuario' : 'Novo Usuario'">Usuario</title>
</head>
<body>
<div layout:fragment="content">

	<h1 class="h3 mb-4" th:text="${usuarioForm.idUsuario} != null ? 'Editar Usuario' : 'Novo Usuario'">Usuario</h1>

	<div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

	<div class="card card-form p-4 p-md-5">
	<form method="post" th:object="${usuarioForm}"
		  th:action="${usuarioForm.idUsuario} != null ? @{/usuarios/{id}(id=${usuarioForm.idUsuario})} : @{/usuarios}">

		<div class="mb-3">
			<label class="form-label">Usuario *</label>
			<input type="text" class="form-control" th:field="*{username}"
				   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" autocomplete="username">
			<div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
		</div>

		<div class="mb-3">
			<label class="form-label" th:text="${usuarioForm.idUsuario} != null ? 'Nova senha' : 'Senha *'">Senha</label>
			<input type="password" class="form-control" th:field="*{password}"
				   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" autocomplete="new-password">
			<div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
			<div class="form-text" th:if="${usuarioForm.idUsuario} != null">Deixe em branco para manter a senha atual.</div>
		</div>

		<div class="mb-3">
			<label class="form-label">Perfil *</label>
			<select class="form-select" th:field="*{role}">
				<option value="ADMIN">Administrador</option>
				<option value="USER">Usuario</option>
			</select>
		</div>

		<div class="form-check form-switch mb-3">
			<input class="form-check-input" type="checkbox" role="switch" id="enabled" th:field="*{enabled}">
			<label class="form-check-label" for="enabled">Ativo</label>
		</div>

		<div class="mt-4 d-flex gap-2">
			<button type="submit" class="btn btn-primary">Salvar</button>
			<a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a>
		</div>
	</form>
	</div>

</div>
</body>
</html>
