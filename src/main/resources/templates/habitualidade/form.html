<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/base}"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
	<title th:text="${habitualidadeForm.idFreq} != null ? 'Editar Habitualidade' : 'Nova Habitualidade'">Habitualidade</title>
</head>
<body>
<div layout:fragment="content">

	<h1 class="h3 mb-4" th:text="${habitualidadeForm.idFreq} != null ? 'Editar Habitualidade' : 'Nova Habitualidade'">Habitualidade</h1>

	<div class="card mb-3">
		<div class="card-body py-2">
			<span class="text-muted small">Socio:</span>
			<strong th:text="${habitualidadeForm.socioNome}"></strong>
			<span class="text-muted small ms-2" th:text="'CPF ' + ${habitualidadeForm.socioCpf}"></span>
		</div>
	</div>

	<div class="card card-form p-4 p-md-5">
	<form method="post" th:object="${habitualidadeForm}"
		  th:action="${habitualidadeForm.idFreq} != null ? @{/habitualidades/{id}(id=${habitualidadeForm.idFreq})} : @{/habitualidades}">
		<input type="hidden" th:field="*{idSocio}">

		<div class="row g-3 mb-4">
			<div class="col-md-2">
				<label class="form-label">Mes</label>
				<input type="text" class="form-control" th:field="*{mes}">
			</div>
			<div class="col-md-2">
				<label class="form-label">Ano</label>
				<input type="text" class="form-control" th:field="*{ano}">
			</div>
			<div class="col-md-2">
				<label class="form-label">Nivel</label>
				<input type="text" class="form-control" th:field="*{nivel}">
			</div>
			<div class="col-md-3">
				<label class="form-label">Data de Filiacao</label>
				<input type="date" class="form-control" th:field="*{datafiliacao}">
			</div>
			<div class="col-md-3">
				<label class="form-label">Data de Validade</label>
				<input type="date" class="form-control" th:field="*{datavalidade}">
			</div>

			<div class="col-md-3">
				<label class="form-label">CPF</label>
				<input type="text" class="form-control" th:field="*{cpf}">
			</div>
			<div class="col-md-3">
				<label class="form-label">CR</label>
				<input type="text" class="form-control" th:field="*{numcr}">
			</div>
			<div class="col-md-6">
				<label class="form-label">Endereco</label>
				<input type="text" class="form-control" th:field="*{endereco}">
			</div>

			<div class="col-md-3">
				<label class="form-label">Municao</label>
				<input type="text" class="form-control" th:field="*{municao}">
			</div>
			<div class="col-md-3">
				<label class="form-label">Treinos</label>
				<input type="text" class="form-control" th:field="*{treinos}">
			</div>
			<div class="col-md-2">
				<label class="form-label">Municipal</label>
				<input type="text" class="form-control" th:field="*{municipal}">
			</div>
			<div class="col-md-2">
				<label class="form-label">Estadual</label>
				<input type="text" class="form-control" th:field="*{estadual}">
			</div>
			<div class="col-md-2">
				<label class="form-label">Federal</label>
				<input type="text" class="form-control" th:field="*{federal}">
			</div>

			<div class="col-md-3">
				<label class="form-label">Livro SIS</label>
				<input type="text" class="form-control" th:field="*{livrosis}">
			</div>
			<div class="col-md-3">
				<label class="form-label">Folha / N. Registro</label>
				<input type="text" class="form-control" th:field="*{folhanumregistro}">
			</div>
			<div class="col-md-3">
				<label class="form-label">Data de Lancamento</label>
				<input type="date" class="form-control" th:field="*{datalancamento}">
			</div>
			<div class="col-md-3">
				<label class="form-label">Numero CLAM</label>
				<input type="text" class="form-control" th:field="*{numclam}">
			</div>
		</div>

		<h2 class="h5 mb-3">Registros de Frequencia</h2>
		<p class="text-muted small">Ate 20 lancamentos de data, SIGMA, municao utilizada e evento.</p>

		<div class="table-responsive mb-4">
			<table class="table table-sm table-bordered align-middle">
				<thead class="table-light">
					<tr>
						<th style="width:3rem">#</th>
						<th style="width:11rem">Data</th>
						<th>SIGMA</th>
						<th>Municao</th>
						<th>Evento</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="row, stat : *{registros}">
						<td class="text-muted" th:text="${stat.count}"></td>
						<td>
							<input type="date" class="form-control form-control-sm"
								   th:field="*{registros[__${stat.index}__].data}">
						</td>
						<td>
							<input type="text" class="form-control form-control-sm"
								   th:field="*{registros[__${stat.index}__].sigma}">
						</td>
						<td>
							<input type="text" class="form-control form-control-sm"
								   th:field="*{registros[__${stat.index}__].municao}">
						</td>
						<td>
							<input type="text" class="form-control form-control-sm"
								   th:field="*{registros[__${stat.index}__].evento}">
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div class="d-flex gap-2">
			<button type="submit" class="btn btn-primary">Salvar</button>
			<a class="btn btn-outline-secondary" th:href="@{/habitualidades}">Cancelar</a>
		</div>
	</form>
	</div>

</div>
</body>
</html>
