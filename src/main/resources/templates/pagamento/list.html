<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/base}"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
	<title>Pagamentos</title>
</head>
<body>
<div layout:fragment="content">

	<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
		<h1 class="h3 mb-0">Pagamentos</h1>
		<a class="btn btn-primary" th:href="@{/socio-picker(target='/pagamentos/novo', targetLabel='Pagamento')}">+ Novo Pagamento</a>
	</div>

	<div class="card search-panel p-3 p-md-4 mb-4">
	<form class="row g-2 align-items-end live-search-form" method="get" th:action="@{/pagamentos}">
		<div class="col-sm-6 col-md-4">
			<label class="form-label small mb-1">Nome do Socio</label>
			<input type="text" class="form-control" name="nome" th:value="${nome}">
		</div>
		<div class="col-sm-6 col-md-3">
			<label class="form-label small mb-1">CPF</label>
			<input type="text" class="form-control" name="cpf" th:value="${cpf}">
		</div>
		<div class="col-md-2 d-flex gap-2">
			<button type="submit" class="btn btn-outline-primary w-100">Pesquisar</button>
		</div>
	</form>
	</div>

	<div id="resultados" th:fragment="resultados">

	<div class="table-responsive">
		<table class="table table-striped table-hover align-middle">
			<thead>
				<tr>
					<th>Socio</th>
					<th>CPF</th>
					<th>Pagamento</th>
					<th class="text-end">Acoes</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item : ${page.content}">
					<td th:text="${item.socio.nome}"></td>
					<td th:text="${item.socio.cpf}"></td>
					<td th:text="${item.pagamento}"></td>
					<td class="text-end text-nowrap">
						<a class="btn btn-sm btn-outline-secondary" th:href="@{/pagamentos/{id}/editar(id=${item.idPag})}">Editar</a>
						<button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal"
								th:attr="data-bs-target=${'#excluirModal' + item.idPag}">Excluir</button>

						<div class="modal fade" tabindex="-1" th:id="${'excluirModal' + item.idPag}">
							<div class="modal-dialog">
								<div class="modal-content text-start">
									<div class="modal-header">
										<h5 class="modal-title">Confirmar exclusao</h5>
										<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
									</div>
									<div class="modal-body">Confirma a exclusao deste pagamento?</div>
									<div class="modal-footer">
										<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
										<form method="post" th:action="@{/pagamentos/{id}/excluir(id=${item.idPag})}">
											<button type="submit" class="btn btn-danger">Excluir</button>
										</form>
									</div>
								</div>
							</div>
						</div>
					</td>
				</tr>
				<tr th:if="${page.empty}">
					<td colspan="4" class="text-center text-muted py-4">Nenhum pagamento encontrado.</td>
				</tr>
			</tbody>
		</table>
	</div>

	<nav th:if="${page.totalPages > 1}" aria-label="Paginacao">
		<ul class="pagination flex-wrap">
			<li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
				th:classappend="${i == page.number} ? 'active'">
				<a class="page-link" th:href="@{/pagamentos(page=${i}, size=${page.size}, nome=${nome}, cpf=${cpf})}" th:text="${i + 1}"></a>
			</li>
		</ul>
	</nav>

	</div>

</div>
</body>
</html>
